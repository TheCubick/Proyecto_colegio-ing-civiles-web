<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Trazos técnicos abiertos (mosaico de 360×360 sin uniones visibles): curvas de nivel, ejes
       topográficos punteados, arcos de compás y cotas a 45°. Solo #383637 al 4–6 % de opacidad. -->
  <g fill="none" stroke="#383637" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
    <!-- Curvas de nivel suaves: entran y salen a la misma altura, así continúan en el cuadro vecino -->
    <g stroke-opacity="0.045">
      <path d="M0 248C60 224 112 270 182 246S302 222 360 248"/>
      <path d="M0 272C64 250 118 294 188 270S306 248 360 272"/>
      <path d="M0 296C68 276 124 318 194 294S310 274 360 296"/>
    </g>

    <!-- Ejes topográficos punteados (el patrón de guiones cabe exacto en 360 px) -->
    <path stroke-opacity="0.05" stroke-dasharray="1 7" d="M0 120H360"/>
    <path stroke-opacity="0.04" stroke-dasharray="10 6 2 6" d="M96 0V360"/>

    <!-- Arco de compás con su centro y radio -->
    <g stroke-opacity="0.06">
      <path d="M242 41A70 70 0 0 1 299 122"/>
      <path stroke-dasharray="4 5" d="M230 110L287 70"/>
      <path d="M224 110H236M230 104V116"/>
    </g>

    <!-- Abatimiento de puerta (cuarto de arco abierto) -->
    <path stroke-opacity="0.05" d="M40 26V60H74M74 60A34 34 0 0 0 40 26"/>

    <!-- Cota a 45° con líneas de extensión -->
    <g stroke-opacity="0.055">
      <path d="M150 220L214 156"/>
      <path d="M144 214L156 226M208 150L220 162"/>
      <path d="M140 200L150 190M196 154L206 144"/>
    </g>

    <!-- Marca de nivel -->
    <path stroke-opacity="0.05" d="M300 196L308 204L316 196ZM294 196H322"/>
  </g>
</svg>
