<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sitio del Colegio de Ingenieros Civiles de Tuxtla Gutiérrez, A.C. (CICTGZ): requisitos de ingreso, trámites de DRO, RT y Dictaminador de Riesgos, cursos y contacto." />
    <title>CICTGZ | Colegio de Ingenieros Civiles de Tuxtla Gutiérrez, A.C.</title>
    <!-- El logo-colegio.svg pesa 9 MB: el favicon es el mismo logo (sin modificar) reducido a PNG -->
    <link rel="icon" type="image/png" href="/img/logos/favicon.png" />
    <link rel="apple-touch-icon" href="/img/logos/apple-touch-icon.png" />
    <meta name="theme-color" content="#BA2A33" />

    <!-- Fuentes: preconnect + link directo (antes iban en un @import del CSS, que las retrasaba).
         DM Sans sin el peso 500 (casi no se usa). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
    />

    <!-- Open Graph: tarjeta al compartir el enlace en WhatsApp o Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="CICTGZ" />
    <meta property="og:title" content="CICTGZ | Colegio de Ingenieros Civiles de Tuxtla Gutiérrez, A.C." />
    <meta property="og:description" content="Sitio del Colegio de Ingenieros Civiles de Tuxtla Gutiérrez, A.C. (CICTGZ): requisitos de ingreso, trámites de DRO, RT y Dictaminador de Riesgos, cursos y contacto." />
    <!--
      PENDIENTE (F2-MF3 + F2-JA2): cuando exista el dominio publicado y la imagen 1200×630 de Jocelyn
      (public/img/og-cictgz.jpg), quitar este comentario y cambiar DOMINIO:
      <meta property="og:image" content="https://DOMINIO/img/og-cictgz.jpg" />
      <meta name="twitter:card" content="summary_large_image" />
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
